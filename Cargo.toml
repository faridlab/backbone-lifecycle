[package]
name = "backbone-lifecycle"
version = "0.2.2"
edition = "2021"
description = "Minimal Backbone Framework module skeleton"

[lib]
path = "src/lib.rs"

[dependencies]
# -----------------------------------------------------------------------------
# Backbone Framework crates
#
# Pulled directly from the public framework repository so this skeleton works
# anywhere on disk without path fix-up. For reproducible builds, pin to a
# specific tag or commit by replacing `branch = "main"` with `tag = "vX.Y.Z"`
# or `rev = "<commit-sha>"`. Cargo dedupes the git fetch — the repo is only
# cloned once even though four crates reference it.
# -----------------------------------------------------------------------------
backbone-core = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.8", features = ["postgres"] }
backbone-orm = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.8" }
# v2.7.1 + the axum feature: guarded-route handlers extract `CompanyContext` (the tenant off
# the signed token) as an axum extractor — the same guarded-surface pattern the recruitment
# module composes with.
backbone-auth = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.8", features = ["axum"] }
backbone-messaging = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.8" }
# Transactional-outbox producer (ADR-005): stages `promotion.effective` / `onboarding.completed` /
# `offboarding.closed` in the same tx as the lifecycle state change. v2.7.4 is where backbone-outbox
# 0.2.0 (with the company-RLS fence) ships; the HR composer's [patch] block unifies it onto local
# HEAD for dev. No features needed on the producer side — `runner`/`multi_tenant` are the relay's
# concern (backbone-hr-app).
backbone-outbox = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.8" }
# GL-posting port (the single seam producers reach accounting through): the final-settlement
# confirm verb builds its balanced envelope with these types and pushes it through a
# `GlPostSink` the host app wires at composition time. v2.7.7 is where the envelope carried
# the party-tagged lines the settlement needs. Lifecycle never depends on backbone-accounting
# itself — the port crate is the whole contract.
backbone-gl-posting = { git = "https://github.com/faridlab/backbone-framework", tag = "v2.7.8" }

# Core async runtime and serialization
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Money/quantities — near-universal in domain modules. Generated code for any `decimal`
# field imports rust_decimal, so ship it (and the matching sqlx feature) by default.
rust_decimal = { version = "1.36", features = ["serde"] }

# Database (PostgreSQL primary)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "rust_decimal"] }

# HTTP framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
serde_yaml = "0.9"

# Protocol Buffers (Generated from Schema-First YAML)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

[features]
default = []
events = []
auth = []
grpc = []
openapi = []
validation = []

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
mockall = "0.12"
pretty_assertions = "1.0"

# Integration testing framework — the generated tests/integration_tests.rs hits a live server
# via reqwest; guarded-route probes hit the router in-process via tower's ServiceExt::oneshot.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# The three career-lifecycle compound-event flows (ADR-005) cross into backbone-employee +
# backbone-payroll + backbone-timeoff: the integration tests drive the producers here, then run the
# consumers to prove the end-to-end outbox flow + idempotency. Dev-only — production never depends
# lifecycle→employee/payroll/timeoff (the composer wires them, never the modules directly).
backbone-employee = { path = "../backbone-employee" }
backbone-payroll = { path = "../backbone-payroll" }
backbone-timeoff = { path = "../backbone-timeoff" }
jsonwebtoken = "9.3"
rand = "0.8"
