server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/lifecycle.log
module:
  name: lifecycle
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  clearance_item:
    collection: clearance_items
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  exit_interview:
    collection: exit_interviews
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  final_settlement:
    collection: final_settlements
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  offboarding:
    collection: offboardings
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  onboarding:
    collection: onboardings
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  onboarding_task:
    collection: onboarding_tasks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  promotion:
    collection: promotions
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  onboarding_template:
    collection: onboarding_templates
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  onboarding_template_task:
    collection: onboarding_template_tasks
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
