# Codegen policy for lifecycle.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # Hand-authored behavior (services + their HTTP surface). Examples:
  # - "src/application/service/onboarding_service.rs"
  # - "src/presentation/http/guarded_routes.rs"
  - "src/application/service/pesangon.rs"
  # ADR-005 producers: lifecycle write services (emit outbox events in-tx with state changes).
  - "src/application/service/promotion_write_service.rs"
  - "src/application/service/onboarding_write_service.rs"
  - "src/application/service/offboarding_write_service.rs"
  - "src/application/service/offboarding_ports.rs"
  # Checkpoint create verbs + the mail-activity seam they notify through (fail-closed when unwired).
  - "src/application/service/activity_port.rs"
  - "src/application/service/checkpoint_write_service.rs"
  # Settlement drafting/confirmation + the GL-posting seam (post-before-stamp, idempotent per offboarding).
  - "src/application/service/final_settlement_write_service.rs"
  # The guarded HTTP composition (read-only CRUD + validated verbs) — the recommended mount.
  - "src/presentation/http/guarded_routes.rs"

  # Hand-authored migrations (the tenancy strip — its ordering guard is hand-written logic,
  # not schema-derived emission; the file must never carry a generated-file header or be
  # overwritten back to a company-fenced shape).
  - "migrations/20260909000000_strip_tenancy.up.sql"
  - "migrations/20260909000000_strip_tenancy.down.sql"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  # The career-lifecycle compound-event flow suite (hand-written producer→relay→consumer
  # integration tests, not schema-derived).
  - "tests/career_lifecycle_flows.rs"
  # - "tests/*_golden_cases.rs"
  # - "tests/integrity_probes.rs"

  # Hand-authored module documentation.
  - "docs/**"
