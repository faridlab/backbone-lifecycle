        position_id_from:
          nullable: true
          type: string
          format: uuid
        position_id_to:
          nullable: true
          type: string
          format: uuid
        level_id_from:
          nullable: true
          type: string
          format: uuid
        level_id_to:
          nullable: true
          type: string
          format: uuid
        department_id_from:
          nullable: true
          type: string
          format: uuid
        department_id_to:
          nullable: true
          type: string
          format: uuid
        proposed_salary:
          nullable: true
          type: string
        effective_date:
          type: string
          format: date
        status:
          type: string
        approval_request_id:
          nullable: true
          type: string
          format: uuid
        requested_by:
          nullable: true
          type: string
          format: uuid
        approved_by:
          nullable: true
          type: string
          format: uuid
        appraisal_id:
          nullable: true
          type: string
          format: uuid
        appraisal_rating:
          nullable: true
          type: string
        reason:
          nullable: true
          type: string
        metadata:
          type: object

    PromotionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 5

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input data
        details:
          type: object
          additionalProperties: true

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortByParam:
      name: sort_by
      in: query
      schema:
        type: string

    SortOrderParam:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  requestBodies:
    BatchIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                items: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
